<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mahadev Bazar</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

html,body{width:100%;min-height:100%}

body{
  min-height:100vh;
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

body:before{
  content:"";
  position:fixed;
  width:300px;
  height:300px;
  border-radius:50%;
  background:rgba(255,170,0,.07);
  filter:blur(80px);
  top:15%;
  left:50%;
  transform:translateX(-50%);
  pointer-events:none;
}

.card{
  width:min(92%,430px);
  min-height:100vh;
  padding:30px 22px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  position:relative;
}

/* MAHADEV PHOTO */
.logo-wrap{
  width:172px;
  height:172px;
  padding:4px;
  border-radius:50%;
  background:linear-gradient(
    145deg,
    #f5bd3b,
    #fff0a0,
    #8f5700,
    #f5bd3b
  );
  box-shadow:0 0 30px rgba(245,189,59,.22);
  margin-bottom:23px;
}

.logo{
  width:100%;
  height:100%;
  border-radius:50%;
  overflow:hidden;
  background:#000;
  border:3px solid #000;
}

.logo img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

h1{
  font-size:30px;
  font-weight:900;
  letter-spacing:.5px;
  margin-bottom:7px;
}

.username{
  color:#f4bd43;
  font-size:15px;
  font-weight:700;
  margin-bottom:13px;
}

.desc{
  color:#a5a5a5;
  font-size:14px;
  line-height:1.55;
  max-width:320px;
  margin-bottom:27px;
}

.telegram-btn{
  width:100%;
  max-width:330px;
  height:56px;
  border-radius:15px;
  background:#229ED9;
  color:#fff;
  text-decoration:none;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:9px;
  font-size:16px;
  font-weight:800;
  box-shadow:0 8px 25px rgba(34,158,217,.25);
  transition:.2s;
}

.telegram-btn:hover{
  transform:translateY(-2px);
  box-shadow:0 12px 30px rgba(34,158,217,.35);
}

.telegram-btn:active{
  transform:scale(.98);
}

.telegram-btn svg{
  width:23px;
  height:23px;
  fill:#fff;
}

.small{
  margin-top:16px;
  display:flex;
  align-items:center;
  gap:6px;
  color:#707070;
  font-size:11px;
}

.small svg{
  width:14px;
  height:14px;
  fill:#229ED9;
}

.footer{
  position:absolute;
  bottom:14px;
  font-size:10px;
  color:#444;
}

@media(max-height:650px){
  .logo-wrap{
    width:130px;
    height:130px;
    margin-bottom:16px;
  }

  h1{
    font-size:25px;
  }

  .desc{
    margin-bottom:20px;
  }

  .telegram-btn{
    height:50px;
  }
}
</style>
</head>
