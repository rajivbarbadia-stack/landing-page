<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mahadev Bazar</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
  font-family:Arial,sans-serif;
  background:#000;
  color:#fff;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  background:radial-gradient(
    circle at 50% 43%,
    #100b00 0%,
    #030200 35%,
    #000 70%
  );
}

.container{
  width:100%;
  max-width:720px;
  min-height:100vh;
  text-align:center;
  padding:90px 22px 45px;
}

/* MAHADEV PHOTO CIRCLE */
.logo-circle{
  width:390px;
  height:390px;
  max-width:78vw;
  max-height:78vw;
  margin:0 auto 45px;
  border-radius:50%;
  padding:9px;
  background:linear-gradient(
    135deg,
    #fff0a0,
    #d89408,
    #ffe68a,
    #a76500
  );
  box-shadow:0 0 30px rgba(255,190,40,.28);
  overflow:hidden;
}

.logo-circle img{
  width:100%;
  height:100%;
  display:block;
  border-radius:50%;
  object-fit:cover;
  object-position:center;
  background:#000;
}

h1{
  font-size:48px;
  margin:0 0 22px;
  font-weight:800;
}

.username{
  font-size:29px;
  font-weight:800;
  color:#ffc533;
  margin-bottom:36px;
}

.desc{
  font-size:24px;
  line-height:1.5;
  color:#aaa;
  margin:0 auto 42px;
  max-width:620px;
}

.btn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:18px;
  width:90%;
  max-width:590px;
  margin:auto;
  padding:27px 20px;
  border-radius:28px;
  background:#29a9e0;
  color:#fff;
  text-decoration:none;
  font-size:31px;
  font-weight:800;
  box-shadow:0 0 28px rgba(41,169,224,.22);
}

.telegram-icon{
  font-size:42px;
  line-height:1;
}

.handle{
  margin-top:28px;
  color:#777;
  font-size:22px;
}

.handle span{
  color:#27a9e0;
  margin-right:8px;
}

@media(max-width:500px){

  .container{
    padding-top:90px;
  }

  .logo-circle{
    margin-bottom:45px;
  }

  h1{
    font-size:38px;
  }

  .username{
    font-size:25px;
  }

  .desc{
    font-size:20px;
  }

  .btn{
    font-size:25px;
    padding:23px 15px;
  }
}
</style>
</head>

<body>

<main class="container">

  <div class="logo-circle">

    <!-- MAHADEV PHOTO -->
    <img
      src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcU...PASTE_IMAGE_DATA_HERE..."
      alt="Mahadev Bazar"
    >

  </div>

  <h1>Mahadev Bazar</h1>

  <div class="username">
    @mahadevbazarr
  </div>

  <p class="desc">
    Join our Telegram for the latest updates and<br>
    stay connected with Mahadev Bazar.
  </p>

  <a
    class="btn"
    href="https://t.me/mahadevbazarr"
  >
    <span class="telegram-icon">➤</span>
    <span>Open Telegram</span>
  </a>

  <div class="handle">
    <span>➤</span>@mahadevbazarr
  </div>

</main>

</body>
</html>
