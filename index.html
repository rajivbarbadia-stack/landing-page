<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Contact Us</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;

      font-family: Arial, Helvetica, sans-serif;

      background:
        radial-gradient(
          circle at 15% 15%,
          rgba(255,255,255,0.14),
          transparent 25%
        ),
        radial-gradient(
          circle at 85% 80%,
          rgba(0,200,255,0.20),
          transparent 30%
        ),
        linear-gradient(
          135deg,
          #168fc9 0%,
          #3478e8 50%,
          #4c8df1 100%
        );
    }

    /* Background diagonal lines */
    body::before {
      content: "";
      position: fixed;
      inset: -100px;

      opacity: 0.16;

      background:
        repeating-linear-gradient(
          115deg,
          transparent 0px,
          transparent 7px,
          rgba(255,255,255,0.35) 8px,
          transparent 9px
        );

      pointer-events: none;
    }

    .container {
      position: relative;

      width: min(92%, 760px);

      text-align: center;

      z-index: 2;
    }

    /* Top heading */
    .top-label {
      display: inline-block;

      padding: 9px 28px;

      border: 1px solid rgba(255,255,255,0.8);
      border-radius: 40px;

      color: #ffffff;

      font-size: 12px;
      font-weight: 700;

      letter-spacing: 4px;

      margin-bottom: 85px;

      background: rgba(255,255,255,0.03);

      backdrop-filter: blur(6px);
    }

    /* Main clickable card */
    .telegram-card {
      position: relative;

      width: 100%;
      min-height: 160px;

      display: flex;
      align-items: center;

      padding: 25px 45px 25px 175px;

      border-radius: 90px;

      text-decoration: none;

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,0.98),
          rgba(224,241,247,0.96)
        );

      border: 6px solid #08afe9;

      box-shadow:
        0 0 0 3px rgba(0,80,180,0.30),
        0 18px 40px rgba(0,50,130,0.35),
        inset 0 3px 10px rgba(255,255,255,0.9);

      transition:
        transform 0.25s ease,
        box-shadow 0.25s ease;
    }

    .telegram-card:hover {
      transform: translateY(-6px);

      box-shadow:
        0 0 0 3px rgba(0,80,180,0.40),
        0 25px 50px rgba(0,40,120,0.45),
        inset 0 3px 10px rgba(255,255,255,0.9);
    }

    .telegram-card:active {
      transform: scale(0.98);
    }

    /* Telegram circle */
    .telegram-icon {
      position: absolute;

      left: -16px;
      top: 50%;

      transform: translateY(-50%);

      width: 178px;
      height: 178px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background:
        radial-gradient(
          circle at 35% 28%,
          #45ceff,
          #078fd4 55%,
          #005fc1 100%
        );

      border: 7px solid #007dcc;

      box-shadow:
        0 0 0 4px rgba(0,210,255,0.40),
        0 14px 32px rgba(0,60,150,0.45),
        inset 0 5px 15px rgba(255,255,255,0.35);
    }

    /* Telegram logo */
    .telegram-icon svg {
      width: 96px;
      height: 96px;

      fill: #ffffff;

      filter:
        drop-shadow(
          0 5px 5px rgba(0,0,0,0.18)
        );
    }

    /* Text */
    .join-text {
      width: 100%;

      text-align: center;

      color: #111111;
    }

    .join-text .small {
      display: block;

      font-size: 18px;

      letter-spacing: 2px;

      margin-bottom: 9px;
    }

    .join-text .contact {
      display: block;

      font-size: clamp(28px, 5vw, 44px);

      font-weight: 900;

      letter-spacing: 1px;

      color: #111111;
    }

    /* Small decorative dots */
    .dots {
      position: absolute;

      width: 85px;
      height: 55px;

      background-image:
        radial-gradient(
          white 1.5px,
          transparent 1.5px
        );

      background-size: 10px 10px;

      opacity: 0.7;
    }

    .dots.one {
      left: -105px;
      top: -78px;
    }

    .dots.two {
      right: -80px;
      bottom: -75px;
    }

    /* Arrows */
    .arrows {
      position: absolute;

      right: -85px;
      top: 75px;

      color: white;

      font-size: 25px;

      line-height: 22px;

      opacity: 0.8;
    }

    .arrows.left {
      right: auto;
      left: -105px;
      top: auto;
      bottom: 105px;
    }

    /* Bottom text */
    .bottom-text {
      margin-top: 100px;

      color: #ffffff;

      font-size: 30px;

      font-weight: 900;

      letter-spacing: 5px;

      text-shadow:
        0 5px 15px rgba(0,0,0,0.15);
    }

    /* Mobile */
    @media (max-width: 600px) {

      .container {
        width: 90%;
      }

      .top-label {
        font-size: 9px;

        letter-spacing: 2px;

        padding: 8px 20px;

        margin-bottom: 70px;
      }

      .telegram-card {
        min-height: 130px;

        padding:
          20px
          18px
          20px
          105px;

        border-width: 4px;

        border-radius: 70px;
      }

      .telegram-icon {
        width: 118px;
        height: 118px;

        left: -11px;

        border-width: 5px;
      }

      .telegram-icon svg {
        width: 66px;
        height: 66px;
      }

      .join-text .small {
        font-size: 13px;

        letter-spacing: 1px;

        margin-bottom: 6px;
      }

      .join-text .contact {
        font-size: 25px;

        letter-spacing: 0;
      }

      .bottom-text {
        margin-top: 75px;

        font-size: 20px;

        letter-spacing: 3px;
      }

      .dots.one {
        left: -5px;
        top: -65px;
      }

      .dots.two {
        right: -5px;
        bottom: -65px;
      }

      .arrows {
        display: none;
      }
    }

    /* Very small phones */
    @media (max-width: 380px) {

      .telegram-card {
        padding-left: 95px;
      }

      .telegram-icon {
        width: 105px;
        height: 105px;
      }

      .telegram-icon svg {
        width: 58px;
        height: 58px;
      }

      .join-text .contact {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- Top Label -->
    <div class="top-label">
      TELEGRAM CHANNEL
    </div>


    <!-- CLICKABLE TELEGRAM CARD -->
    <a
      class="telegram-card"
      href="https://t.me/mahadevbazarr"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Contact Us on Telegram"
    >

      <!-- Telegram Icon -->
      <div class="telegram-icon">

        <svg viewBox="0 0 24 24">
          <path d="M21.9 4.2L18.6 20c-.25 1.12-.91 1.4-1.85.87l-5.1-3.76-2.46 2.37c-.27.27-.5.5-1.02.5l.37-5.2 9.47-8.55c.41-.37-.09-.58-.64-.21L5.67 13.05.65 11.48c-1.09-.34-1.11-1.09.23-1.6L20.5 2.23c.91-.34 1.71.2 1.4 1.97z"/>
        </svg>

      </div>


      <!-- Visible Text -->
      <div class="join-text">

        <span class="small">
          JOIN US ON
        </span>

        <span class="contact">
          CONTACT US
        </span>

      </div>

    </a>


    <!-- Decorative Elements -->
    <div class="dots one"></div>

    <div class="dots two"></div>


    <!-- Right Arrows -->
    <div class="arrows">
      △<br>
      △<br>
      △
    </div>


    <!-- Left Arrows -->
    <div class="arrows left">
      ▽<br>
      ▽<br>
      ▽
    </div>


    <!-- Bottom Text -->
    <div class="bottom-text">
      JOIN TELEGRAM
    </div>

  </div>

</body>
</html>
